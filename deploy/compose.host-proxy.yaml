name: opsmanager

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: opsmanager:local
    restart: unless-stopped
    env_file: .env
    environment:
      OPS_DATABASE_URL: postgres://ops:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/ops?sslmode=disable
      OPS_CHROMIUM_URL: ws://chromium:9222
      OPS_UPLOADS_DIR: /data/uploads
    ports:
      - "127.0.0.1:${OPS_HOST_PORT:-8090}:8080"
    volumes:
      - uploads:/data/uploads
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
      chromium:
        condition: service_started
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "opsmanager", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  db:
    image: postgres:19.0-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ops
      POSTGRES_DB: ops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pg_data:/var/lib/postgresql
    networks:
      - internal
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d ops"]
      interval: 10s
      timeout: 5s
      retries: 10

  chromium:
    image: chromedp/headless-shell:159.0.8154.13
    restart: unless-stopped
    shm_size: 256m
    networks:
      - internal
    mem_limit: 640m
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9222"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  internal:

volumes:
  pg_data:
  uploads:
