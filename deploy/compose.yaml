name: opsmanager

services:
  caddy:
    image: caddy:2.11.9-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      OPS_DOMAIN: ${OPS_DOMAIN:?OPS_DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: opsmanager:local
    restart: unless-stopped
    env_file: .env
    environment:
      OPS_DATABASE_URL: postgres://ops:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/ops?sslmode=disable
      OPS_CHROMIUM_URL: ${OPS_CHROMIUM_URL:-ws://chromium:9222}
      OPS_UPLOADS_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    networks:
      - web
      - internal
    depends_on:
      db:
        condition: service_healthy
      chromium:
        condition: service_started
    healthcheck:
      test: ["CMD", "opsmanager", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  db:
    image: postgres:19.0-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: ops
      POSTGRES_DB: ops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pg_data:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d ops"]
      interval: 10s
      timeout: 5s
      retries: 10

  chromium:
    image: chromedp/headless-shell:159.0.8154.13
    restart: unless-stopped
    shm_size: 512m
    networks:
      - internal
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9222"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  web:
  internal:

volumes:
  caddy_data:
  caddy_config:
  pg_data:
  uploads:
